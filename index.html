function getDB(k){if(_dbCache[k])return _dbCache[k];if(!FIREBASE_CONFIGS[k])return null;try{var app=firebase.initializeApp(FIREBASE_CONFIGS[k],"db_"+k.replace(/\s/g,"_"));var db=firebase.firestore(app);db.settings({experimentalAutoDetectLongPolling:true});_dbCache[k]=db;return db}catch(e){return null}}

<!-- MAIN APP AREA -->
<div id="mainPage" class="hidden">
<aside id="sidebar" class="sidebar">
  <div class="p-5 border-b border-border"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-gradient-to-br from-kopAccent to-yellow-600 flex items-center justify-center"><i class="fas fa-server text-kop text-lg"></i></div><div><h2 class="font-display text-kopAccent font-bold text-sm" id="appTitle">SAT</h2><p class="text-muted text-xs" id="appSubtitle">System</p></div></div></div>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="card" id="modalBody" style="max-width:800px;width:100%;max-height:90vh;overflow-y:auto;"></div></div>

<script>
// ================= GLOBAL STATE =================
var CURRENT_USER = { role: '', data: null, kelas: '' };
var SYSTEM_CONFIG = {}; // Menyimpan config per kelas

// ================= CORE FUNCTIONS =================
function showToast(m,t){t=t||'success';var c=document.getElementById('toastContainer'),e=document.createElement('div');e.className='toast toast-'+t;e.innerHTML='<i class="fas fa-'+(t==='success'?'check-circle':t==='warning'?'exclamation-triangle':'times-circle')+'"></i><span>'+m+'</span>';c.appendChild(e);setTimeout(function(){if(e.parentNode)e.remove()},5000)}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');document.getElementById('modalBody').innerHTML=''}
function openModal(h){document.getElementById('modalOverlay').classList.remove('hidden');document.getElementById('modalBody').innerHTML=h}
function toggleSidebar(){var s=document.getElementById('sidebar');s.classList.toggle('-translate-x-full')}
function showLogin(role){
  if(role==='admin'){document.getElementById('modalAdminLogin').classList.remove('hidden');return}
  
  var container=document.getElementById('authFormContainer');
  document.getElementById('authPage').querySelector('.grid').classList.add('hidden');
  container.classList.remove('hidden');

  if(role==='guru'){
    container.innerHTML='<div class="text-center mb-6"><i class="fas fa-chalkboard-teacher text-info text-4xl mb-3"></i><h2 class="font-bold text-xl">Login Guru</h2></div><div><label class="text-xs text-muted">NIP</label><input type="text" id="guruNIP" class="input-field mb-4" placeholder="Masukkan NIP" onkeydown="if(event.key==='Enter')doGuruLogin()"></div><button onclick="doGuruLogin()" class="btn-primary w-full">Masuk</button><button onclick="location.reload()" class="btn-secondary w-full mt-2">Kembali</button>';
  } else if (role==='siswa'){
    container.innerHTML='<div class="text-center mb-6"><i class="fas fa-laptop-code text-success text-4xl mb-3"></i><h2 class="font-bold text-xl">Login Siswa</h2></div><div><label class="text-xs text-muted">NISN</label><input type="text" id="siswaNISN" class="input-field mb-3" placeholder="Masukkan NISN"></div><div><label class="text-xs text-muted">Token Ujian</label><input type="text" id="siswaToken" class="input-field mb-4 font-mono text-center tracking-widest uppercase" placeholder="XXXXXX" maxlength="8"></div><button onclick="doSiswaLogin()" class="btn-primary w-full">Masuk Ujian</button><button onclick="location.reload()" class="btn-secondary w-full mt-2">Kembali</button>';
  }
}

// ================= LOGIN LOGIC =================
function doLogin(){
  var code=document.getElementById('adminCode').value.trim();
  if(code!=='korekapi2026'){showToast('Kode Salah!','error');return}
  CURRENT_USER.role='admin';
  enterApp();
}

function doGuruLogin(){
  var nip=document.getElementById('guruNIP').value.trim();
  if(!nip){showToast('Isi NIP','error');return}
  showToast('Mencari data...','warning');
  // Cari di semua kelas
  Promise.all(KELAS_LIST.map(function(k){var db=getDB(k);if(!db)return Promise.resolve(null);return db.collection('guru').where('nip','==',nip).limit(1).get().then(function(s){if(s.empty)return null;var d=s.docs[0].data();d._id=s.docs[0].id;d._db=k;return d})})).then(function(results){
    var found=results.find(function(r){return r!==null});
    if(!found){showToast('NIP tidak ditemukan','error');return}
    CURRENT_USER.role='guru'; CURRENT_USER.data=found; CURRENT_USER.kelas=found.jenis==='guru kelas'?found.kelas:'Kelas 1';
    enterApp();
  });
}

function doSiswaLogin(){
  var nisn=document.getElementById('siswaNISN').value.trim();
  var token=document.getElementById('siswaToken').value.trim().toUpperCase();
  if(!nisn||!token){showToast('Lengkapi data','error');return}
  
  // 1. Cari Token
  Promise.all(KELAS_LIST.map(function(k){var db=getDB(k);if(!db)return Promise.resolve(null);return db.collection('tokens').where('token','==',token).limit(1).get().then(function(s){if(s.empty)return null;return{data:s.docs[0].data(),kelas:k}})})).then(function(tResults){
    var tFound=tResults.find(function(r){return r!==null});
    if(!tFound){showToast('Token Salah/Expired','error');return}
    var tData=tFound.data; var tKelas=tFound.kelas;
    
    // 2. Cek Kuota (DI SINI KUNCI KUOTA DITERAPKAN)
    var db=getDB(tKelas);
    db.collection('config').doc('settings').get().then(function(docSnap){
      if(docSnap.exists){
        var cfg=docSnap.data();
        if(cfg.kuotaLimit !== undefined && cfg.kuotaLimit > 0){
           // Cek jumlah nilai yang sudah masuk
           db.collection('nilai').where('mapel','==',tData.mapel).get().then(function(snap){
             if(snap.size >= cfg.kuotaLimit){
               showToast('KUOTA PENUH! Hubungi Guru.','error'); return;
             }
             proceedSiswaAuth(db, tData, tKelas, nisn);
           });
           return;
        }
      }
      proceedSiswaAuth(db, tData, tKelas, nisn);
    });
  });
}

function proceedSiswaAuth(db, tData, tKelas, nisn){
  db.collection('siswa').where('nisn','==',nisn).where('rombel','==',tData.rombel).limit(1).get().then(function(s){
    if(s.empty){showToast('Siswa tidak ditemukan di rombel ini','error');return}
    var sData=s.docs[0].data(); sData._id=s.docs[0].id;
    // Cek duplikat nilai
    db.collection('nilai').doc(tKelas+'_'+tData.rombel+'_'+tData.mapel+'_'+nisn).get().then(function(d){
      if(d.exists){showToast('Sudah mengerjakan','error');return}
      CURRENT_USER.role='siswa'; CURRENT_USER.data=sData; CURRENT_USER.tokenData=tData; CURRENT_USER.kelas=tKelas;
      enterApp();
    });
  });
}

function enterApp(){
  document.getElementById('authPage').style.display='none';
  document.getElementById('mainPage').classList.remove('hidden');
  if(CURRENT_USER.role==='admin'){
    document.getElementById('dbSel').classList.remove('hidden');
    fillDD();
    loadAdminConfig(); // Load config saat pertama buka
    navTo('dashboard');
  } else if (CURRENT_USER.role==='guru'){
    document.getElementById('appTitle').textContent='GURU PANEL';
    document.getElementById('appSubtitle').textContent=CURRENT_USER.data.nama;
    // Load Config dari kelas aktif guru
    loadGuruConfig().then(navTo('dashboard'));
  } else {
    // Siswa langsung ujian
    startExam();
  }
}

// ================= CONFIG HANDLING (ADMIN LOCK) =================
function loadAdminConfig(){
  var db=getDB(document.getElementById('dbSel').value);
  if(!db)return;
  db.collection('config').doc('settings').get().then(function(d){
    SYSTEM_CONFIG[document.getElementById('dbSel').value] = d.exists?d.data():{kuotaLimit:0, allowEdit:true};
    rControlPanel(document.getElementById('pageContent')); // Refresh view kalau sedang di menu kontrol
  }).catch(function(){});
}

function loadGuruConfig(){
  return new Promise(function(res){
    var db=getDB(CURRENT_USER.kelas);
    if(!db){res();return}
    db.collection('config').doc('settings').onSnapshot(function(d){
      SYSTEM_CONFIG[CURRENT_USER.kelas] = d.exists?d.data():{allowEdit:true, kuotaLimit:0};
      // Update tampilan UI jika tombol terkunci/buka
      updateGuruUI();
      res();
    });
  });
}

function updateGuruUI(){
  var cfg = SYSTEM_CONFIG[CURRENT_USER.kelas] || {};
  // Cari semua tombol edit/hapus dan disable/enable
  var editBtns = document.querySelectorAll('.guru-edit-btn');
  var addBtns = document.querySelectorAll('.guru-add-btn');
  var lockMsg = '<div class="text-danger text-xs font-bold text-center p-2 border border-danger/30 rounded bg-danger/10"><i class="fas fa-lock mr-1"></i>FITUR DIKUNCI ADMIN</div>';
  
  if(!cfg.allowEdit){
    editBtns.forEach(function(b){b.disabled=true; b.innerHTML='<i class="fas fa-lock"></i>'});
    addBtns.forEach(function(b){b.disabled=true; b.classList.add('opacity-50','cursor-not-allowed')});
    // Tampilkan notifikasi di header
    var h=document.querySelector('.card'); if(h&&!h.querySelector('.admin-lock-notice')){h.insertAdjacentHTML('afterbegin','<div class="admin-lock-notice bg-danger/10 border-l-4 border-danger p-3 mb-4 text-sm text-danger"><i class="fas fa-exclamation-circle mr-2"></i><strong>Mode Baca Saja:</strong> Admin telah mengunci fitur editing.</div>')}
  } else {
    editBtns.forEach(function(b){b.disabled=false; b.innerHTML=b.getAttribute('data-orig-icon')||'<i class="fas fa-edit"></i>'}); // Simpel restore
    addBtns.forEach(function(b){b.disabled=false; b.classList.remove('opacity-50','cursor-not-allowed')});
    var lockNotice=document.querySelector('.admin-lock-notice'); if(lockNotice)lockNotice.remove();
  }
}

// ================= ADMIN: KONTROL PANEL =================
function rControlPanel(c){
  var kelas=document.getElementById('dbSel').value;
  var cfg=SYSTEM_CONFIG[kelas]||{kuotaLimit:0,allowEdit:true};
  
  var h='<div class="fade-in space-y-6">';
  h+='<div class="card border-kopAccent/30"><h3 class="font-bold text-light mb-4">Pengaturan Akses & Kuota</h3><p class="text-xs text-muted mb-4">Pengaturan ini berlaku untuk <span class="text-kopAccent font-bold">'+kelas+'</span> saja.</p>';
  
  h+='<div class="flex items-center justify-between p-4 bg-dark/40 rounded-lg mb-4">';
  h+='<div><div class="font-bold text-light">Izinkan Guru Edit Soal/TP</div><div class="text-xs text-muted">Jika dimatikan, Guru hanya bisa melihat (Read-Only).</div></div>';
  h+='<label class="switch"><input type="checkbox" id="swEdit" '+(cfg.allowEdit?'checked':'')+' onchange="saveConfig(\''+kelas+'\',\'allowEdit\',this.checked)"><span class="slider"></span></label>';
  h+='</div>';

  h+='<div class="p-4 bg-dark/40 rounded-lg">';
  h+='<div class="flex justify-between mb-2"><div class="font-bold text-light">Batas Kuota Peserta</div><div class="text-xs text-muted">0 = Tanpa Batas</div></div>';
  h+='<div class="flex gap-2"><input type="number" id="inpQuota" class="input-field" value="'+(cfg.kuotaLimit||0)+'" min="0"><button onclick="saveConfig(\''+kelas+'\',\'kuotaLimit\',document.getElementById(\'inpQuota\').value)" class="btn-primary text-sm">Simpan Kuota</button></div>';
  h+='</div>';
  
  h+='</div></div>';
  c.innerHTML=h;
}

function saveConfig(kelas,key,val){
  var db=getDB(kelas);
  if(!db){showToast('DB Error','error');return}
  var data={};
  data[key]=val;
  db.collection('config').doc('settings').set(data,{merge:true}).then(function(){
    showToast('Pengaturan disimpan');
    loadAdminConfig();
  }).catch(function(e){showToast('Gagal: '+e.message,'error')});
}

// ================= NAVIGATION & ROUTING =================
function switchDB(k){
  document.getElementById('dbSel').value=k;
  loadAdminConfig(); // Reload config saat ganti kelas
  navTo('dashboard');
}
function fillDD(){var s=document.getElementById('dbSel');s.innerHTML='';KELAS_LIST.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;if(k===CURRENT_USER.kelas)o.selected=true;s.appendChild(o);});}

function navTo(page){
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});
  var t=document.querySelector('.nav-item[data-page="'+page+'"]');if(t)t.classList.add('active');
  
  var c=document.getElementById('pageContent');
  document.getElementById('pageTitle').textContent=page.replace(/-/g,' ').toUpperCase();
  
  if(CURRENT_USER.role==='admin'){
    if(page==='dashboard')rDashAdmin(c);
    else if(page==='control')rControlPanel(c);
    else c.innerHTML='<div class="p-10 text-center text-muted">Fitur ini belum aktif di mode Admin (gunakan Control Panel).</div>';
  } else if (CURRENT_USER.role==='guru'){
    if(page==='dashboard')rDashGuru(c);
    else if(page==='bank-soal')rBankSoalGuru(c);
    else c.innerHTML='<div class="p-10 text-center text-muted">Halaman: '+page+'</div>';
  }
}

// ================= RENDER DASHBOARD (Simple) =================
function rDashAdmin(c){
  var h='<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">';
  KELAS_LIST.forEach(function(k){
    var dbStat = '<div class="text-xs text-muted mt-1">Loading...</div>';
    var db=getDB(k);
    if(db) db.collection('questions').get().then(function(s){var el=document.getElementById('stat-'+k.replace(/\s/g,'')); if(el)el.textContent=s.size+' Soal';});
    h+='<div class="card text-center hover:brightness-110 transition-all border-l-4 '+(k===document.getElementById('dbSel').value?'border-kopAccent':'border-border')+'" onclick="switchDB(\''+k+'\')"><div class="text-xl font-bold text-light">'+k+'</div><div id="stat-'+k.replace(/\s/g,'')+'">'+dbStat+'</div></div>';
  });
  h+='</div>';
  c.innerHTML=h;
}

function rDashGuru(c){
  c.innerHTML='<div class="card"><h3 class="font-bold text-light mb-2">Selamat Datang, '+CURRENT_USER.data.nama+'</h3><p class="text-muted text-sm">Anda login sebagai Guru Kelas '+CURRENT_USER.kelas+'</p></div>';
  updateGuruUI(); // Cek status kunci saat load dashboard
}

function rBankSoalGuru(c){
  // Tampilkan Bank Soal sederhana dengan tombol "Edit"
  var db=getDB(CURRENT_USER.kelas);
  c.innerHTML='<div class="card"><div class="flex justify-between mb-4"><h3 class="font-bold">Bank Soal</h3><button class="guru-add-btn btn-primary text-sm" onclick="alert(\'Fitur Tambah Soal\')"><i class="fas fa-plus"></i> Tambah</button></div><div id="bankList" class="space-y-2 max-h-[60vh] overflow-y-auto"></div></div>';
  var list=document.getElementById('bankList');
  db.collection('questions').limit(10).get().then(function(s){
    if(s.empty){list.innerHTML='<p class="text-muted text-center">Kosong</p>';return}
    s.forEach(function(d){
      var q=d.data();
      var h='<div class="bg-dark/30 p-3 rounded flex justify-between items-center"><span class="text-sm text-light">'+(q.text||'').substring(0,50)+'...</span><button class="guru-edit-btn btn-secondary text-xs py-1" data-orig-icon="<i class=\'fas fa-edit\'></i>" onclick="alert(\'Edit: '+q.text.substring(0,10)+'\')"><i class="fas fa-edit"></i></button></div>';
      list.insertAdjacentHTML('beforeend',h);
    });
    updateGuruUI(); // Terapkan kunci setelah render
  });
}

// Setup Sidebar
document.addEventListener('DOMContentLoaded',function(){
  if(CURRENT_USER.role==='admin'){
    document.getElementById('sidebarNav').innerHTML='<div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt w-5"></i>Dashboard</div><div class="nav-item" data-page="control"><i class="fas fa-lock w-5"></i>Kontrol & Kuota</div>';
  } else if (CURRENT_USER.role==='guru'){
    document.getElementById('sidebarNav').innerHTML='<div class="nav-item active" data-page="dashboard"><i class="fas fa-home w-5"></i>Beranda</div><div class="nav-item" data-page="bank-soal"><i class="fas fa-list w-5"></i>Bank Soal</div>';
  }
});
document.getElementById('sidebarNav').addEventListener('click',function(e){var i=e.target.closest('.nav-item');if(i)navTo(i.dataset.page)});

// Placeholder Siswa
function startExam(){document.getElementById('pageContent').innerHTML='<div class="card text-center py-10"><h2 class="text-2xl font-bold text-success">UJIAN DIMULAI</h2><p>Token: '+CURRENT_USER.tokenData.token+'</p><p>Mapel: '+CURRENT_USER.tokenData.mapel+'</p></div>';}
</script>
